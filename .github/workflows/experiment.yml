name: experiment

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Single language to run, or all."
        required: false
        default: "all"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/experiment.yml"
      - ".github/scripts/latest-workflow-update.mjs"
      - "config/**"
      - "package.json"
      - "packages/graph/**"
      - "packages/graph-sitter/**"
      - "sidecars/**"
      - "tests/experiment/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

# Deliberately no concurrency cancellation. Classification jobs and language
# jobs can be admitted out of push order, so an older run must never be able to
# cancel current-head evidence. A publication-only synchronize and every manual
# dispatch likewise leave all requested work intact.

jobs:
  latest_update:
    name: latest update
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pull-request path filters see the whole base-to-topic diff. The event's
      # before/after pair identifies whether this particular push changed the
      # real-language experiment surface.
      #
      # Carrying forward, because skipping is only honest when the head being
      # skipped for has evidence. A push that touches the experiment surface,
      # followed while it is still running by one that does not, would otherwise
      # publish a green experiment check on the second head having executed
      # nothing — and if the first run then failed, the head a reader merges on
      # would be green while the only run that covered the change was red.
      - name: Classify the exact pushed update
        id: classify
        run: |
          node .github/scripts/latest-workflow-update.mjs \
            --carry-forward-workflow=experiment.yml \
            --include=.github/workflows/experiment.yml \
            --include=.github/scripts/latest-workflow-update.mjs \
            --include=config/** \
            --include=package.json \
            --include=packages/graph/** \
            --include=packages/graph-sitter/** \
            --include=sidecars/** \
            --include=tests/experiment/** \
            --include=pnpm-lock.yaml \
            --include=pnpm-workspace.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}

  experiment:
    needs: latest_update
    if: ${{ needs.latest_update.outputs.run == 'true' }}
    name: ${{ matrix.language }} LSP
    runs-on: ubuntu-latest
    # Fourteen rows install a released producer and finish in minutes; the
    # ninety-minute bound is theirs and stays exactly where it is. C and C++
    # build a compiler from source, and that is a property of the row rather
    # than a defect inside it. Measured on this runner: the build takes 56
    # minutes from its first step to a linked `clangd`, after nine minutes of
    # checkout, install, toolchain and configure, and the real-corpus lifecycle
    # run follows that. Ninety did not fit; 150 leaves room without pretending
    # to predict, and it is still a bound, so a lane that hangs is still
    # caught. The wider bound is granted only to the two rows that build.
    #
    # The restore below should keep an ordinary push far away from it, though
    # that is an expectation rather than a property: Actions caches are
    # branch-scoped and evicted, so a first push on a fresh branch still pays
    # the whole build.
    timeout-minutes: ${{ (matrix.language == 'c' || matrix.language == 'cpp') && 150 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        language:
          - typescript
          - go
          - rust
          - cpp
          - c
          - java
          - csharp
          - kotlin
          - swift
          - scala
          - zig
          - python
          - ruby
          - php
          - lua
          - dart

    steps:
      - name: Skip unselected language
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.language != 'all' && inputs.language != matrix.language }}
        run: echo "Skipping ${{ matrix.language }}"

      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        uses: actions/checkout@v7

      - name: Enable pnpm
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: corepack enable

      - name: Setup Node
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        if: ${{ matrix.language == 'go' && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language) }}
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: sidecars/go/go.sum

      - name: Setup Swift
        if: ${{ matrix.language == 'swift' && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language) }}
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Install
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: pnpm install --frozen-lockfile

      - name: Build package
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: pnpm build

      # C and C++ are the only rows whose producer is built rather than
      # downloaded, and it is a pinned commit: the same bytes, reproduced from
      # scratch, on every push. Restoring them instead is not a shortcut around
      # the build but a removal of work that had no reason to happen twice.
      #
      # The key hashes every file the built bytes depend on. `catalog.mjs` is
      # the one `setup` actually reads its commit from, so it has to be here —
      # keying on the adapter's constant alone would leave the two bound only
      # by a text assertion in a different workflow, and a divergence would hit
      # the key, fail the `--version` check, rebuild, and then not re-save,
      # because an exact hit has nothing to write. That is silent, permanent,
      # full-cost rebuilding, so the binding is made structural instead.
      #
      # Restore and save are split so the save runs even when a later step
      # fails. A campaign iterating on these lanes is exactly the case where
      # the producer builds and the experiment does not, and `cache`'s combined
      # form would discard a correct 110-minute build because a corpus
      # assertion afterwards went red.
      - name: Restore the pinned Clang producer
        id: clang_producer
        if: ${{ (matrix.language == 'c' || matrix.language == 'cpp') && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language) }}
        uses: actions/cache/restore@v6
        with:
          path: tests/experiment/.work/tools
          key: clang-producer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/graph/src/provider/cpp/CPP_CLANG_PRODUCER_COMMIT.ts', 'tests/experiment/src/catalog.mjs', 'tests/experiment/src/setup-language.mjs') }}

      - name: Install language server
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: pnpm --filter @samchon/graph-experiment run setup -- --language ${{ matrix.language }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Saved before the experiment runs, not after it, and only on a miss.
      # The producer is proved by this point — `setup` refuses to finish unless
      # the installed binary reports the pinned commit — and what follows is a
      # corpus run whose failure says nothing about the compiler that was
      # built. Waiting until the end would tie a correct build's survival to an
      # unrelated assertion.
      - name: Save the pinned Clang producer
        if: ${{ (matrix.language == 'c' || matrix.language == 'cpp') && steps.clang_producer.outputs.cache-hit != 'true' && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language) }}
        uses: actions/cache/save@v6
        with:
          path: tests/experiment/.work/tools
          key: ${{ steps.clang_producer.outputs.cache-primary-key }}

      - name: Run LSP experiment
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: pnpm --filter @samchon/graph-experiment start -- --language ${{ matrix.language }}
        env:
          SAMCHON_GRAPH_RUST_ANALYZER_HIR: ${{ github.workspace }}/tests/experiment/.work/tools/bin/samchon-rust-analyzer

      - name: Upload result
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language) }}
        uses: actions/upload-artifact@v7
        with:
          name: graph-lsp-${{ matrix.language }}
          path: tests/experiment/results/${{ matrix.language }}.json
          if-no-files-found: ignore
