name: index-time

# The readiness measurement, not a gate.
#
# `tests/benchmark/graph/index-time.mjs` times what it costs to build the index
# before a tool can answer its first question. It has existed complete and unrun;
# this workflow is what runs it. It is deliberately not attached to every push:
# a measurement that gates a merge becomes a thing people make green, and the
# number stops meaning what it says.
#
# One language per job, and one job per runner. That matters more here than
# anywhere else in this repository: a cold build is one sample with no median to
# hide behind, so two lanes sharing a machine would corrupt each other's wall
# clock. A GitHub-hosted runner is a single-tenant VM, which is the strongest
# quietness claim available without a dedicated host — and its CPU model varies
# between runs, which is why every cell carries the host block that records it.
# A reader comparing two cells has to be able to see whether they ran on the same
# machine, and cells from different hosts are not one comparison.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Single corpus project to measure, or all."
        required: false
        default: "all"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/index-time.yml"
      - "tests/benchmark/**"
      # Except the results themselves. Committing a measurement would otherwise
      # trigger the measurement, whose collect job publishes results, which is a
      # loop with a benchmark inside it. What the numbers are is not a reason to
      # take them again; what produced them is.
      - "!tests/benchmark/results/**"

concurrency:
  group: index-time-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: ${{ matrix.project }} index
    runs-on: ubuntu-latest
    # Ninety, because the thing being measured is allowed to be slow. Ruby and
    # Dart both ran into the harness's own 30-minute per-spawn cap rather than
    # into anything wrong, and a cap that fires before the build finishes turns
    # a slow answer into no answer. How long a project waits before its first
    # question is the entire subject here, so the budget has to be able to
    # contain an unflattering result.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: excalidraw, language: typescript }
          - { project: gin, language: go }
          - { project: flask, language: python }
          - { project: tokio, language: rust }
          - { project: gson, language: java }
          - { project: redis, language: c }
          - { project: leveldb, language: cpp }
          - { project: sinatra, language: ruby }
          - { project: slim, language: php }
          - { project: serilog, language: csharp }
          - { project: koin, language: kotlin }
          - { project: lualine, language: lua }
          - { project: darthttp, language: dart }

    steps:
      - name: Skip unselected project
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.project != 'all' && inputs.project != matrix.project }}
        run: echo "Skipping ${{ matrix.project }}"

      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.project == 'all' || inputs.project == matrix.project }}
        uses: actions/checkout@v7

      - name: Enable pnpm
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.project == 'all' || inputs.project == matrix.project }}
        run: corepack enable

      - name: Setup Node
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.project == 'all' || inputs.project == matrix.project }}
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The Go provider builds its sidecar from source, so the toolchain has to
      # be present before the language setup runs.
      - name: Setup Go
        if: ${{ matrix.language == 'go' && (github.event_name != 'workflow_dispatch' || inputs.project == 'all' || inputs.project == matrix.project) }}
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: sidecars/go/go.sum

      - name: Install
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.project == 'all' || inputs.project == matrix.project }}
        run: pnpm install --frozen-lockfile

      - name: Build package
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.project == 'all' || inputs.project == matrix.project }}
        run: pnpm build

      # The same provisioning the experiment matrix uses. It appends each tool's
      # directory to GITHUB_PATH, so the benchmark's own child processes resolve
      # the server without a machine-global install.
      - name: Install language server
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.project == 'all' || inputs.project == matrix.project }}
        run: pnpm --filter @samchon/graph-experiment run setup -- --language ${{ matrix.language }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `--tools samchon-graph` needs no comparator installed. The comparator
      # arms are a separate decision with their own installation surface, and
      # measuring this product's own readiness does not wait on it.
      #
      # `--no-website` keeps every job's result in its own report; folding them
      # into one publication is the collect job's work, because a cell written by
      # thirteen concurrent jobs would race on one file.
      - name: Measure cold index build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.project == 'all' || inputs.project == matrix.project }}
        # `=` on every valued option, deliberately. `index-time.mjs`'s parser
        # special-cases `--project` and otherwise takes `--name=value`; a bare
        # `--name` becomes a flag and its would-be value becomes a positional,
        # which the project selector then reads as a corpus name. Written the
        # other way, `--tools samchon-graph` asks for a project called
        # `samchon-graph` and the run dies before it measures anything.
        run: |
          node tests/benchmark/graph/index-time.mjs \
            --project=${{ matrix.project }} \
            --tools=samchon-graph \
            --await-quiet=240 \
            --no-website \
            --out="$GITHUB_WORKSPACE/index-time-out/${{ matrix.project }}"
        env:
          # A dedicated runner is the quietest host available here, so hold the
          # measurement to it rather than warning and continuing.
          #
          # It has to be *allowed* to become quiet first. The steps above — a
          # checkout, a dependency install, a build, and a language-server
          # download — leave a one-minute load average several times the CPU
          # count, and the first run of this workflow was refused by its own gate
          # at ratio 1.60 on a four-core runner. `--await-quiet` waits for that
          # to decay so the gate's claim is true; turning the gate off would only
          # have stopped it being checked.
          SAMCHON_BENCH_REQUIRE_QUIET: "1"
          # One hour per spawn, against a 30-minute default. sinatra and
          # darthttp died on that default with ETIMEDOUT after a clean setup —
          # not a crash, not a hang anyone diagnosed, just a build still running
          # when the stopwatch was taken away. Raising it is how the question
          # gets answered rather than truncated; if an hour is also not enough,
          # that is a finding worth having instead of a timeout worth repeating.
          SAMCHON_GRAPH_BENCH_TIMEOUT_MS: "3600000"

      # The whole output directory, not just the report. A lane that fails
      # writes its diagnosis to `<label>.err.log` beside the report, and
      # uploading only `report.json` meant a failed lane produced no report and
      # therefore no artifact — so the one run where something went wrong was
      # the one run that told you nothing. serilog's dump exited 1 with its
      # reason sitting in a file this step used to discard.
      #
      # The collect job's glob is unaffected: the report is still at the root of
      # the artifact, and the logs are extra files beside it.
      - name: Upload report and logs
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.project == 'all' || inputs.project == matrix.project) }}
        uses: actions/upload-artifact@v7
        with:
          name: index-time-${{ matrix.project }}
          path: index-time-out/${{ matrix.project }}
          if-no-files-found: ignore

  collect:
    name: collect
    needs: measure
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          pattern: index-time-*
          path: index-time-reports

      # Folded one report at a time through the harness's own `--publish` path,
      # which merges cells by (project, tool) and leaves `structural` and `agent`
      # untouched. A project whose job failed contributed no report and therefore
      # has no cell — which is the honest record of a language that could not be
      # measured, and is not the same as a zero.
      #
      # `--publish=` with the `=`, for the same reason the measure step spells its
      # options that way, and this step got it wrong while the one above it
      # explained why. Written `--publish "$report"` the parser files `--publish`
      # as a valueless flag and the path as a positional, and `selectProjects` —
      # which runs at module scope, above the publish branch — rejects it as an
      # unknown project. The mistake hid because it needs a report to reveal it:
      # with none, `nullglob` skips the loop entirely and the step passes. It
      # would have failed on the first language that ever measured successfully,
      # which is the only run this workflow exists to produce.
      - name: Fold reports into the publication
        run: |
          shopt -s nullglob
          found=0
          for report in index-time-reports/*/report.json; do
            echo "folding $report"
            node tests/benchmark/graph/index-time.mjs --publish="$report"
            found=$((found + 1))
          done
          echo "folded $found report(s)"
          if [ "$found" = "0" ]; then
            echo "::warning::no index-time report was produced"
          fi

      - name: Show what was measured
        run: node tests/benchmark/graph/index-time-summary.mjs

      - name: Upload publication
        uses: actions/upload-artifact@v7
        with:
          name: index-time-publication
          path: tests/benchmark/results/graph.json
          if-no-files-found: error
