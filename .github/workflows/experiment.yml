name: experiment

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Single language to run, or all."
        required: false
        default: "all"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/experiment.yml"
      - ".github/scripts/latest-workflow-update.mjs"
      - "config/**"
      - "package.json"
      - "packages/graph/**"
      - "packages/graph-sitter/**"
      - "sidecars/**"
      - "tests/experiment/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

# Deliberately no concurrency cancellation. Classification jobs and language
# jobs can be admitted out of push order, so an older run must never be able to
# cancel current-head evidence. A publication-only synchronize and every manual
# dispatch likewise leave all requested work intact.

jobs:
  latest_update:
    name: latest update
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pull-request path filters see the whole base-to-topic diff. The event's
      # before/after pair identifies whether this particular push changed the
      # real-language experiment surface.
      #
      # Carrying forward, because skipping is only honest when the head being
      # skipped for has evidence. A push that touches the experiment surface,
      # followed while it is still running by one that does not, would otherwise
      # publish a green experiment check on the second head having executed
      # nothing — and if the first run then failed, the head a reader merges on
      # would be green while the only run that covered the change was red.
      - name: Classify the exact pushed update
        id: classify
        run: |
          node .github/scripts/latest-workflow-update.mjs \
            --carry-forward-workflow=experiment.yml \
            --include=.github/workflows/experiment.yml \
            --include=.github/scripts/latest-workflow-update.mjs \
            --include=config/** \
            --include=package.json \
            --include=packages/graph/** \
            --include=packages/graph-sitter/** \
            --include=sidecars/** \
            --include=tests/experiment/** \
            --include=pnpm-lock.yaml \
            --include=pnpm-workspace.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}

  experiment:
    needs: latest_update
    if: ${{ needs.latest_update.outputs.run == 'true' }}
    name: ${{ matrix.language }} LSP
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        language:
          - typescript
          - go
          - rust
          - cpp
          - c
          - java
          - csharp
          - kotlin
          - swift
          - scala
          - zig
          - python
          - ruby
          - php
          - lua
          - dart

    steps:
      - name: Skip unselected language
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.language != 'all' && inputs.language != matrix.language }}
        run: echo "Skipping ${{ matrix.language }}"

      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        uses: actions/checkout@v7

      - name: Enable pnpm
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: corepack enable

      - name: Setup Node
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        if: ${{ matrix.language == 'go' && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language) }}
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: sidecars/go/go.sum

      - name: Setup Swift
        if: ${{ matrix.language == 'swift' && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language) }}
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Install
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: pnpm install --frozen-lockfile

      - name: Build package
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: pnpm build

      - name: Install language server
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: pnpm --filter @samchon/graph-experiment run setup -- --language ${{ matrix.language }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run LSP experiment
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: pnpm --filter @samchon/graph-experiment start -- --language ${{ matrix.language }}

      - name: Upload result
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language) }}
        uses: actions/upload-artifact@v7
        with:
          name: graph-lsp-${{ matrix.language }}
          path: tests/experiment/results/${{ matrix.language }}.json
          if-no-files-found: ignore
