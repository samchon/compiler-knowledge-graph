name: experiment

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Single language to run, or all."
        required: false
        default: "all"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/experiment.yml"
      - ".github/scripts/latest-workflow-update.mjs"
      - "config/**"
      - "package.json"
      - "packages/graph/**"
      - "packages/graph-sitter/**"
      - "sidecars/**"
      - "tests/experiment/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

# Deliberately no concurrency cancellation. Classification jobs and language
# jobs can be admitted out of push order, so an older run must never be able to
# cancel current-head evidence. A publication-only synchronize and every manual
# dispatch likewise leave all requested work intact.

jobs:
  latest_update:
    name: latest update
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.classify.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pull-request path filters see the whole base-to-topic diff. The event's
      # before/after pair identifies whether this particular push changed the
      # real-language experiment surface.
      #
      # Carrying forward, because skipping is only honest when the head being
      # skipped for has evidence. A push that touches the experiment surface,
      # followed while it is still running by one that does not, would otherwise
      # publish a green experiment check on the second head having executed
      # nothing — and if the first run then failed, the head a reader merges on
      # would be green while the only run that covered the change was red.
      - name: Classify the exact pushed update
        id: classify
        run: |
          node .github/scripts/latest-workflow-update.mjs \
            --carry-forward-workflow=experiment.yml \
            --include=.github/workflows/experiment.yml \
            --include=.github/scripts/latest-workflow-update.mjs \
            --include=config/** \
            --include=package.json \
            --include=packages/graph/** \
            --include=packages/graph-sitter/** \
            --include=sidecars/** \
            --include=tests/experiment/** \
            --include=pnpm-lock.yaml \
            --include=pnpm-workspace.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}

  clang_producer:
    needs: latest_update
    if: ${{ needs.latest_update.outputs.run == 'true' }}
    name: pinned Clang producer
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Skip when no C-family lane was requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.language != 'all' && inputs.language != 'c' && inputs.language != 'cpp' }}
        run: echo "The requested language does not consume the Clang producer."

      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == 'c' || inputs.language == 'cpp' }}
        uses: actions/checkout@v7

      - name: Setup Node
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == 'c' || inputs.language == 'cpp' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Restore the pinned Clang producer
        id: clang_producer
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == 'c' || inputs.language == 'cpp' }}
        uses: actions/cache/restore@v6
        with:
          path: tests/experiment/.work/tools
          key: clang-producer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/graph/src/provider/cpp/CPP_CLANG_PRODUCER_COMMIT.ts', 'tests/experiment/src/clang-producer.mjs') }}

      - name: Provision the pinned Clang producer
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == 'c' || inputs.language == 'cpp' }}
        run: node tests/experiment/src/clang-producer.mjs
        env:
          # An exact hit is immutable. If validation rejects it, rebuilding
          # cannot repair that key, so refuse rather than claiming success.
          SAMCHON_GRAPH_CLANG_PRODUCER_ALLOW_BUILD: ${{ steps.clang_producer.outputs.cache-hit != 'true' && '1' || '0' }}

      # This job owns the build and saves it before either corpus consumer can
      # start. A later C or C++ experiment failure cannot discard a successful
      # compiler build, and the two consumers cannot race on one cold key.
      - name: Save the pinned Clang producer
        if: ${{ steps.clang_producer.outputs.cache-hit != 'true' && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == 'c' || inputs.language == 'cpp') }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: tests/experiment/.work/tools
          key: ${{ steps.clang_producer.outputs.cache-primary-key }}

      # Cache writes are best-effort and immutable. The artifact is the
      # guaranteed same-run handoff, including on a fork PR that cannot save a
      # repository cache.
      - name: Upload the verified Clang producer
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == 'c' || inputs.language == 'cpp' }}
        uses: actions/upload-artifact@v7
        with:
          name: pinned-clang-producer
          path: tests/experiment/.work/tools
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  experiment:
    needs: [latest_update, clang_producer]
    if: ${{ always() && needs.latest_update.outputs.run == 'true' }}
    name: ${{ matrix.language }} LSP
    runs-on: ubuntu-latest
    # Compiler construction has its own 150-minute predecessor above. Every
    # matrix row now spends this budget on setup and the real-corpus lifecycle
    # only; C and C++ cannot consume it rebuilding LLVM on a cold cache miss.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        language:
          - typescript
          - go
          - rust
          - cpp
          - c
          - java
          - csharp
          - kotlin
          - swift
          - scala
          - zig
          - python
          - ruby
          - php
          - lua
          - dart

    steps:
      - name: Skip unselected language
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.language != 'all' && inputs.language != matrix.language }}
        run: echo "Skipping ${{ matrix.language }}"

      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        uses: actions/checkout@v7

      - name: Enable pnpm
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: corepack enable

      - name: Setup Node
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        if: ${{ matrix.language == 'go' && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language) }}
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: sidecars/go/go.sum

      - name: Setup Swift
        if: ${{ matrix.language == 'swift' && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language) }}
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Install
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: pnpm install --frozen-lockfile

      - name: Build package
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: pnpm build

      # The producer job uploads the exact tree it verified, independently of
      # whether cross-run cache saving was permitted.
      - name: Download the verified Clang producer
        if: ${{ (matrix.language == 'c' || matrix.language == 'cpp') && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language) }}
        uses: actions/download-artifact@v8
        with:
          name: pinned-clang-producer
          path: tests/experiment/.work/tools

      - name: Install language server
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: pnpm --filter @samchon/graph-experiment run setup -- --language ${{ matrix.language }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAMCHON_GRAPH_CLANG_PRODUCER_ALLOW_BUILD: "0"

      # Node sizes its old space from a heuristic, not from the runner, and on
      # these 16 GiB hosts it settles near 4 GiB, which a real C project's
      # graph outgrows. Ten was too generous in the other direction: the C lane
      # grew into the space clangd needed and the *host* died, which takes the
      # job log with it -- twice the reading that would have explained a run
      # did not exist, because GitHub never received it. Six leaves the
      # producer its half and makes the consumer fail with a number instead of
      # taking the machine down.
      #
      # Six was still not low enough. The C lane died again with no job log at
      # all, and the last trace before it explains why: Node's own resident set
      # was six gibibytes while the host had one hundred and forty-one
      # megabytes left, so the other nine were the producer's. A ceiling bounds
      # old space, not resident set, and a consumer that reaches its ceiling
      # has already taken more than that from the machine.
      #
      # Four was chosen to lose, and it did its job: it kept the runs legible
      # long enough to find that most of the consumer's memory was garbage
      # from a transport that copied every response once per chunk, and that
      # the initial generation was committing three copies of itself where one
      # was proof and the others were a tautology.
      #
      # Eight, and ten was tried. The C walk finishes and reports what it
      # holds -- 6,930 MiB of heap, 7,562 of resident set at the last of 469
      # shards -- and the commit after it failed at both ceilings with
      # `Ineffective mark-compacts near heap limit`. That message is the
      # finding: the heap is nearly all *live*, so no ceiling helps, and at ten
      # the host itself was down to 400 MiB with the producer's measured 4.9
      # GiB beside it.
      #
      # Seven gibibytes of live graph for one 242 translation-unit C project is
      # a property of the representation -- a header's symbols are materialised
      # once per translation unit that includes it -- and not something a
      # ceiling can be chosen around. Eight is where the consumer fails first,
      # cleanly, and leaves the host its margin, which keeps the log that says
      # so.
      - name: Run LSP experiment
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language }}
        run: pnpm --filter @samchon/graph-experiment start -- --language ${{ matrix.language }}
        env:
          # Twelve gibibytes of a sixteen gibibyte host, because the producer
          # no longer wants the rest. Bodies are published as they are built
          # and shards record where they are, so what clangd holds is its own
          # index rather than a copy of every unit's facts.
          #
          # The consumer is what needs the room. fmt is 52 units and 1.4
          # million relationships, and at eight gibibytes the live set sat at
          # 5.5 -- close enough that every major collection walked all of it.
          # A walk that had taken 314 seconds took 6,503, with the producer
          # answering in a hundred milliseconds throughout.
          NODE_OPTIONS: --max-old-space-size=12288
          # What the consumer holds when a whole producer generation has been
          # parsed, and again once it has been adapted and committed. The
          # difference between the two is what decides whether a page can be
          # adapted as it arrives or the shape has to change.
          SAMCHON_GRAPH_CPP_HEAP_TRACE: "1"
          # The language server's own words. A run that stalls waiting for a
          # producer has exactly one witness, and it writes to stderr.
          SAMCHON_GRAPH_LSP_SERVER_LOG: "1"
          SAMCHON_GRAPH_RUST_ANALYZER_HIR: ${{ github.workspace }}/tests/experiment/.work/tools/bin/samchon-rust-analyzer

      - name: Upload result
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.language == 'all' || inputs.language == matrix.language) }}
        uses: actions/upload-artifact@v7
        with:
          name: graph-lsp-${{ matrix.language }}
          path: tests/experiment/results/${{ matrix.language }}.json
          if-no-files-found: ignore
